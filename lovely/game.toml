[patches.pattern]
target = "functions/common_events.lua"
pattern = '''G.GAME.current_round.hands_left = G.GAME.current_round.hands_left + mod'''
position = 'after'
payload = '''if MP.LOBBY.code and mod ~= 0 then
	end'''
